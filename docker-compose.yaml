services:
  init-keys:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vow-init-keys
    volumes:
      - ./keys:/keys
      - ./data:/data/vow
      - ./init-keys.sh:/init-keys.sh:ro
    environment:
      VOW_DID: ${VOW_DID}
      VOW_HOSTNAME: ${VOW_HOSTNAME}
      VOW_ROTATION_KEY_PATH: /keys/rotation.key
      VOW_JWK_PATH: /keys/jwk.key
      VOW_CONTACT_EMAIL: ${VOW_CONTACT_EMAIL}
      VOW_RELAYS: ${VOW_RELAYS:-https://bsky.network}
      VOW_ADMIN_PASSWORD: ${VOW_ADMIN_PASSWORD}
    entrypoint: ["/bin/sh", "/init-keys.sh"]
    restart: "no"

  ipfs:
    image: ipfs/kubo:latest
    container_name: vow-ipfs
    volumes:
      - ipfs_data:/data/ipfs
    environment:
      # "server" profile disables mDNS/LAN discovery, appropriate for a
      # server deployment.
      IPFS_PROFILE: server
    ports:
      # Expose the IPFS gateway so a reverse proxy can serve blobs over HTTPS.
      # Bound to 127.0.0.1 — not reachable from the public internet directly.
      - "127.0.0.1:8081:8080"
      # The RPC API (port 5001) is intentionally NOT exposed to the host.
      # Only the vow container reaches it over the internal Docker network.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  vow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vow-pds
    depends_on:
      init-keys:
        condition: service_completed_successfully
      ipfs:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data/vow
      - ./keys/rotation.key:/keys/rotation.key:ro
      - ./keys/jwk.key:/keys/jwk.key:ro
    environment:
      # ── Required ────────────────────────────────────────────────────────
      VOW_DID: ${VOW_DID}
      VOW_HOSTNAME: ${VOW_HOSTNAME}
      VOW_ROTATION_KEY_PATH: /keys/rotation.key
      VOW_JWK_PATH: /keys/jwk.key
      VOW_CONTACT_EMAIL: ${VOW_CONTACT_EMAIL}
      VOW_RELAYS: ${VOW_RELAYS:-https://bsky.network}
      VOW_ADMIN_PASSWORD: ${VOW_ADMIN_PASSWORD}
      VOW_SESSION_SECRET: ${VOW_SESSION_SECRET}

      # ── Server ──────────────────────────────────────────────────────────
      VOW_ADDR: ":8080"
      VOW_DB_NAME: ${VOW_DB_NAME:-/data/vow/vow.db}

      # ── SMTP (optional) ─────────────────────────────────────────────────
      VOW_SMTP_USER: ${VOW_SMTP_USER:-}
      VOW_SMTP_PASS: ${VOW_SMTP_PASS:-}
      VOW_SMTP_HOST: ${VOW_SMTP_HOST:-}
      VOW_SMTP_PORT: ${VOW_SMTP_PORT:-}
      VOW_SMTP_EMAIL: ${VOW_SMTP_EMAIL:-}
      VOW_SMTP_NAME: ${VOW_SMTP_NAME:-}

      # ── IPFS ────────────────────────────────────────────────────────────
      # RPC API resolves to the ipfs service over the internal Docker network.
      VOW_IPFS_NODE_URL: ${VOW_IPFS_NODE_URL:-http://ipfs:5001}
      # Public gateway URL for sync.getBlob redirects. Leave empty to have
      # vow proxy blob content itself.
      VOW_IPFS_GATEWAY_URL: ${VOW_IPFS_GATEWAY_URL:-}
      # Optional x402-gated remote pinning. When set, accounts with x402
      # pinning enabled will have blobs additionally pinned here after local
      # storage, with payment signed by the user's Ethereum wallet via the
      # browser-based signer.
      VOW_X402_PIN_URL: ${VOW_X402_PIN_URL:-}
      # CAIP-2 chain identifier for the x402 pinning service.
      # Defaults to Base Mainnet (eip155:8453).
      VOW_X402_NETWORK: ${VOW_X402_NETWORK:-eip155:8453}

      # ── Misc (optional) ─────────────────────────────────────────────────
      VOW_FALLBACK_PROXY: ${VOW_FALLBACK_PROXY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/xrpc/_health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  create-invite:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vow-create-invite
    network_mode: "service:vow"
    volumes:
      - ./keys:/keys
      - ./data:/data/vow
      - ./create-initial-invite.sh:/create-initial-invite.sh:ro
    environment:
      VOW_DID: ${VOW_DID}
      VOW_HOSTNAME: ${VOW_HOSTNAME}
      VOW_ROTATION_KEY_PATH: /keys/rotation.key
      VOW_JWK_PATH: /keys/jwk.key
      VOW_CONTACT_EMAIL: ${VOW_CONTACT_EMAIL}
      VOW_RELAYS: ${VOW_RELAYS:-https://bsky.network}
      VOW_ADMIN_PASSWORD: ${VOW_ADMIN_PASSWORD}
      VOW_DB_NAME: ${VOW_DB_NAME:-/data/vow/vow.db}
    depends_on:
      vow:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/create-initial-invite.sh"]
    restart: "no"

volumes:
  ipfs_data:
    driver: local
