version: "3.8"

services:
  init-keys:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/julien/vow:latest
    container_name: vow-init-keys
    volumes:
      - ./keys:/keys
      - ./data:/data/vow
      - ./init-keys.sh:/init-keys.sh:ro
    environment:
      VOW_DID: ${VOW_DID}
      VOW_HOSTNAME: ${VOW_HOSTNAME}
      VOW_ROTATION_KEY_PATH: /keys/rotation.key
      VOW_JWK_PATH: /keys/jwk.key
      VOW_CONTACT_EMAIL: ${VOW_CONTACT_EMAIL}
      VOW_RELAYS: ${VOW_RELAYS:-https://bsky.network}
      VOW_ADMIN_PASSWORD: ${VOW_ADMIN_PASSWORD}
    entrypoint: ["/bin/sh", "/init-keys.sh"]
    restart: "no"

  vow:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/julien/vow:latest
    container_name: vow-pds
    depends_on:
      init-keys:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data/vow
      - ./keys/rotation.key:/keys/rotation.key:ro
      - ./keys/jwk.key:/keys/jwk.key:ro
    environment:
      # Required settings
      VOW_DID: ${VOW_DID}
      VOW_HOSTNAME: ${VOW_HOSTNAME}
      VOW_ROTATION_KEY_PATH: /keys/rotation.key
      VOW_JWK_PATH: /keys/jwk.key
      VOW_CONTACT_EMAIL: ${VOW_CONTACT_EMAIL}
      VOW_RELAYS: ${VOW_RELAYS:-https://bsky.network}
      VOW_ADMIN_PASSWORD: ${VOW_ADMIN_PASSWORD}
      VOW_SESSION_SECRET: ${VOW_SESSION_SECRET}

      # Server configuration
      VOW_ADDR: ":8080"
      VOW_DB_NAME: ${VOW_DB_NAME:-/data/vow/vow.db}
      VOW_BLOCKSTORE_VARIANT: ${VOW_BLOCKSTORE_VARIANT:-sqlite}

      # Optional: SMTP settings for email
      VOW_SMTP_USER: ${VOW_SMTP_USER:-}
      VOW_SMTP_PASS: ${VOW_SMTP_PASS:-}
      VOW_SMTP_HOST: ${VOW_SMTP_HOST:-}
      VOW_SMTP_PORT: ${VOW_SMTP_PORT:-}
      VOW_SMTP_EMAIL: ${VOW_SMTP_EMAIL:-}
      VOW_SMTP_NAME: ${VOW_SMTP_NAME:-}

      # Optional: IPFS pinning configuration
      VOW_IPFS_BLOBSTORE_ENABLED: ${VOW_IPFS_BLOBSTORE_ENABLED:-false}
      VOW_IPFS_NODE_URL: ${VOW_IPFS_NODE_URL:-http://127.0.0.1:5001}
      VOW_IPFS_GATEWAY_URL: ${VOW_IPFS_GATEWAY_URL:-}
      VOW_IPFS_PINNING_SERVICE_URL: ${VOW_IPFS_PINNING_SERVICE_URL:-}
      VOW_IPFS_PINNING_SERVICE_TOKEN: ${VOW_IPFS_PINNING_SERVICE_TOKEN:-}

      # Optional: Fallback proxy
      VOW_FALLBACK_PROXY: ${VOW_FALLBACK_PROXY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/xrpc/_health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  create-invite:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/julien/vow:latest
    container_name: vow-create-invite
    network_mode: "service:vow"
    volumes:
      - ./keys:/keys
      - ./data:/data/vow
      - ./create-initial-invite.sh:/create-initial-invite.sh:ro
    environment:
      VOW_DID: ${VOW_DID}
      VOW_HOSTNAME: ${VOW_HOSTNAME}
      VOW_ROTATION_KEY_PATH: /keys/rotation.key
      VOW_JWK_PATH: /keys/jwk.key
      VOW_CONTACT_EMAIL: ${VOW_CONTACT_EMAIL}
      VOW_RELAYS: ${VOW_RELAYS:-https://bsky.network}
      VOW_ADMIN_PASSWORD: ${VOW_ADMIN_PASSWORD}
      VOW_DB_NAME: ${VOW_DB_NAME:-/data/vow/vow.db}
    depends_on:
      vow:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/create-initial-invite.sh"]
    restart: "no"

volumes:
  data:
    driver: local
